mode: paper   # paper | live — paper until the TWAP-era bar passes (§2 CLAUDE.md)

# =============================================================================
#  SECTION 1: MONEY / RISK - how much to bet and when to stop
# =============================================================================
math:
  kelly_fraction: 0.08        # Fraction of bankroll staked per Kelly unit. Lower = smaller bets.

circuit_breaker:
  floor_pct: 0.85             # Lock in a floor at 85% of each bankroll milestone ($100/$150/$200/...)
  min_multiplier: 0.4         # Kelly never goes below 40% of normal once floor kicks in
  losses_to_reduce: 3         # Consecutive losses before a Discord streak alert (does NOT affect sizing)
  wins_to_restore: 3          # Consecutive wins before a Discord streak alert (does NOT affect sizing)

execution:
  max_bankroll_deployed: 0.8  # Never deploy more than 80% of bankroll across all positions
  max_concurrent_positions: 2 # Max live positions at once (across different windows)
  max_book_fill_pct: 0.5      # Never fill more than 50% of the visible book depth (avoids moving market)
  initial_bankroll: 100.0     # Starting bankroll for paper mode

  # Paper mode realism (ignore for live): paper fills ride the measured live
  # order path (latency sampled below), so the paper->live switch barely
  # changes results. If the host changes, re-measure. network_fail_rate is an
  # ESTIMATE — calibrate from the observed live FOK success rate, and run
  # smoke_order_test.py --confirm to prove order POSTs clear Cloudflare
  # (verify_keys.py covers GETs only).
  slippage_impact_pct: 0.03
  fok_spread_cross_floor: 0.08     # scalp-exit slippage floor (min assumed FOK spread-cross)
  # Latency is SAMPLED from the LIVE ledger's measured order-path POST-RTT
  # distribution (latency_stats.json, 80 samples over 4 live days: p25 0.410 /
  # p50 0.436 / p75 0.679 / p99 1.65, ZERO <= 0.250) via inverse-CDF — the
  # quantile table lives in paper_trader._LATENCY_QUANTILES (a measurement,
  # not a tunable). scale multiplies the draw (1.0 = live-faithful).
  paper_latency_scale: 0.70        # STOCKHOLM MEASURED: six warm signed FOK smoke orders from
                                   # the box ran p50 304ms (300-309) vs the 436ms the quantile
                                   # table carries -> 304/436 = 0.70. Shape-scaling keeps the
                                   # Windows-era tail = conservative. Ledger re-derives the
                                   # true quantiles once box-live fills exist.
  paper_latency_floor_s: 0.30      # fastest measured signed POST from the box
  paper_network_fail_rate: 0.03    # 0 network errors in first 29 live POSTs — consistent, keep

# =============================================================================
#  SECTION 3b: LATE-WINDOW SNIPER — the TWAP lock (gated)
#
#  The market resolves on the official 30s TWAP (strike = the stream's value at
#  the open, final = its value at the close; both verified bit-exact). In the
#  final 30s the resolving average is mostly already observed: when the
#  projection w·A + (1−w)·spot sits further from strike than the frozen error
#  margin (signal_engine.TWAP_MARGIN_*), the outcome is decided — and a late
#  spot whipsaw still dips the WINNER's ask to 0.84-0.93 for 1-4s (measured
#  3/19 windows on night one). The sniper buys those dips, bypassing ONLY
#  max_edge (-> sniper_max_edge) and the late-window time penalty; every safety
#  gate (adverse, edge-decay, depth, net-edge, min-size, pre-submit VWAP,
#  freshness) stays. Kill bar: scripts/analyze_twap_lock.py is the sim ceiling;
#  the BINDING gate is the paper-shadow's realized fills. DO NOT enable on faith.
# =============================================================================
late_window:
  sniper_enabled: true         # kill-bar SAFETY (the emergency brake, not a strategy lever):
                               # false = stop sniping when the post-live kill rule trips. The sniper
                               # is the bot's ONLY strategy — base entries are always suppressed.
  validation_epoch: "2026-08-07T16:25:00+00:00"  # the LEAN machine deploy: Chainlink+CLOB+Gamma
                               # only, no L1/exit engine/old feeds — the bar scores
                               # only the code being validated.
                               # The nightly health job scores only the current mode's fills
                               # at/after this instant in BOTH modes (earlier fills ran the
                               # snapshot-era signal). Reset when a new validation epoch starts.
  twap_zone_s: 30.0             # decision zone = the resolving 30s averaging window; the
                                # projection is undefined earlier (never raise above 30)
  twap_k_min_s: 0.8             # no fires with less time than the FOK round-trip (~0.4s) plus
                                # margin — a fill that can't land before the close is a coin toss
  sniper_min_edge: 0.04         # edge floor AND the ask cap in one knob: fire only when
                                # tier_prob − ask ≥ this (max-tier 0.999 → ask ≤ ~0.96;
                                # p99.5-tier 0.995 → ask ≤ ~0.955). Also the net-edge /
                                # pre-submit floor (SignalEngine.min_edge) — one consistent floor.
  sniper_max_edge: 0.50         # sniper's own sanity cap, replacing the bypassed 0.20
  scar_enforce: []              # learned-veto switch (core/scar_scan.py): gate names from
                                # memory/state/scar_gates.json whose veto is LIVE. Only add a name
                                # after the nightly ping reports it ✅ PROVEN (its OOS SPRT accepted);
                                # empty = all scar gates are shadow-only (stamps, never vetoes).
  sniper_fok_slip: 0.01         # FOK limit pad: fill only within ~one tick of the decision ask, else
                                # let the order DIE. The pad absorbs benign jitter; a genuine reprice
                                # (the dip snapping back to 0.99+ before our order lands) kills the
                                # FOK and the bot sits that window out — never chase a vanished dip
                                # upward. Burst-era realized fills proved wide pads (0.05) buy exactly
                                # the repriced books; one tick sits them out.

# =============================================================================
#  SECTION 3c: OPEN HEAD-START LEG (gated; ledger-separated via signal_leg)
#
#  The strike is the average of the 30s BEFORE the open — known at t=0. A spot
#  that opens displaced from it is a calibrated favorite (measured on 843
#  windows: 72% wins at $10, 83% at $20, 88% at $30; frozen lower-bounded in
#  signal_engine.OPEN_CALIB). Night-one books sold those favorites at 0.62-0.79
#  — this leg buys them only while calibrated prob − ask clears the floor, so
#  it silences itself the day the books adapt. Shares the sniper_enabled brake
#  and every execution gate; its fills stamp signal_leg="open_edge" and its
#  bar/kill are read PER LEG from the nightly ping.
# =============================================================================
open_window:
  open_edge_enabled: false      # KILLED 08-07 on night-one evidence: 22/51 wins (43%)
                                # vs the calibrated 65% — conditional on the book selling
                                # the favorite cheap, the book was right (adverse
                                # selection, z ≈ −3.3). The ping's head-start gauge keeps
                                # measuring unconditionally; re-enable only behind a
                                # fresh calibration that survives a regime split.
  open_zone_s: 20.0             # evaluate only the first N seconds (strike lands ~2s in)
  open_min_edge: 0.06           # calibrated prob − ask floor; mid-price fills pay ~1.6c/sh
                                # fee, so this leg demands more edge than the lock legs

# =============================================================================
#  SECTION 3d: LOCK-INFORMED MAKER BID (the resting twin of the lock-dip taker)
#
#  When a window locks but no dip is trading yet, a GTC bid rests on the locked
#  side at (p99.5 prob − sniper_min_edge − discount) ≈ 0.935: the next whipsaw
#  panic fills us with ZERO latency and queue priority instead of a 0.4s FOK
#  race, and the resting size farms liquidity rewards while it waits. Cancelled
#  the instant the lock weakens or the window closes; the taker leg is
#  suppressed while a bid rests (one entry path per window). PAPER fills are
#  print-through conservative: only tape prints STRICTLY BELOW the bid count.
#  Fills stamp signal_leg="maker_bid" — its own ledger line in the ping.
# =============================================================================
maker:
  maker_bid_enabled: true
  maker_bid_discount: 0.02      # bid = (0.995 − sniper_min_edge) − this ≈ 0.935
  maker_k_place_max: 25.0       # place once locked with at most this many s left
  maker_k_place_min: 3.0        # too late to bother resting under this
  maker_k_cancel_s: 1.0         # pull the order before the close

# =============================================================================
#  SECTION 4: SCHEDULE
# =============================================================================
schedule:
  trading_start_hour_et: 0    # Start at 12:01 AM ET
  trading_start_minute: 1
  trading_end_hour_et: 23     # Stop at 11:30 PM ET
  trading_end_minute: 30

agents:
  outcome_reviewer_interval_seconds: 3600
  daily_pipeline_hour: 23     # Nightly jobs (rollups, retention sweep, sniper health report) at 11:45 PM ET
  daily_pipeline_minute: 45

# =============================================================================
#  DO NOT TOUCH - infrastructure settings
# =============================================================================
market:
  entry_window_seconds: 300
  min_time_remaining_seconds: 0
  scan_cache_seconds: 5
  clob_url: https://clob.polymarket.com
  clob_ws_url: wss://ws-subscriptions-clob.polymarket.com/ws/market
  min_book_depth_usd: 50
  max_spread: 0.1

discord:
  trade_channel_name: polybot-trades
  control_channel_name: polybot-control
  daily_channel_name: polybot-daily

database:
  path: polybot/db/polybot.db
