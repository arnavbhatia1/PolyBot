mode: paper   # deep_proj VALIDATION. The 08-14 live probe went 0-for-5
              # (-$34.18) in a chop regime the OOS sim had already flagged —
              # so the leg validates here, against the same live-calibrated
              # fill rule (strictly-below prints), while the wallet sits out.
              # Go-live again needs the §2 bar: >=6 clean days, >=20 filled
              # windows, EW >= +5c/sh, and a trailing-3-day sim clearing +5c.

# =============================================================================
#  SECTION 1: MONEY / RISK - how much to bet and when to stop
# =============================================================================
math:
  kelly_fraction: 0.08        # Fraction of bankroll staked per Kelly unit. Lower = smaller bets.

circuit_breaker:
  floor_pct: 0.85             # Lock in a floor at 85% of each bankroll milestone ($100/$150/$200/...)
  min_multiplier: 0.4         # Kelly never goes below 40% of normal once floor kicks in
  losses_to_reduce: 3         # Consecutive losses before a Discord streak alert (does NOT affect sizing)
  wins_to_restore: 3          # Consecutive wins before a Discord streak alert (does NOT affect sizing)

execution:
  max_bankroll_deployed: 0.8  # Never deploy more than 80% of bankroll across all positions
  max_concurrent_positions: 2 # Max live positions at once (across different windows)
  max_book_fill_pct: 0.5      # Never fill more than 50% of the visible book depth (avoids moving market)
  initial_bankroll: 150.0     # Starting bankroll for paper mode — matches the
                              # planned go-live funding (~$125-150), so paper
                              # rehearses the exact live sizing. HARD FLOOR
                              # ~135: below it the 0.80 rung falls under the
                              # 5-share exchange minimum and silently drops
                              # from the ladder — fund live to $150, not $125.

  # Paper mode realism (ignore for live): paper fills ride the measured live
  # order path (latency sampled below), so the paper->live switch barely
  # changes results. If the host changes, re-measure. network_fail_rate is an
  # ESTIMATE — calibrate from the observed live FOK success rate, and run
  # smoke_order_test.py --confirm to prove order POSTs clear Cloudflare
  # (verify_keys.py covers GETs only).
  slippage_impact_pct: 0.03
  # Latency is SAMPLED from the LIVE ledger's measured order-path POST-RTT
  # distribution (latency_stats.json, 80 samples over 4 live days: p25 0.410 /
  # p50 0.436 / p75 0.679 / p99 1.65, ZERO <= 0.250) via inverse-CDF — the
  # quantile table lives in paper_trader._LATENCY_QUANTILES (a measurement,
  # not a tunable). scale multiplies the draw (1.0 = live-faithful).
  paper_latency_scale: 0.95        # POST-ASYNC-ROLLOUT MEASURED: live POSTs run p50 ~407-433ms
                                   # (latency_stats n=8 + two fresh 08-07 smoke orders) vs the
                                   # 436ms quantile table -> ~0.95. Re-measure after any
                                   # Polymarket pipeline change (smoke_order_test.py).
  paper_latency_floor_s: 0.32      # fastest measured post-rollout signed POST (p25 318ms)
  paper_network_fail_rate: 0.03    # 0 network errors in first 29 live POSTs — consistent, keep

# =============================================================================
#  SECTION 3b: LATE-WINDOW SNIPER — the TWAP lock (gated)
#
#  The market resolves on the official 60s TWAP (crypto_prices_twap_sixty,
#  rule since 08-14; strike = the stream's value at the open, final = its
#  value at the close; both verified bit-exact). In the final 60s the
#  resolving average is mostly already observed: when the projection
#  w·A + (1−w)·spot sits further from strike than the frozen error margin
#  (signal_engine.TWAP_MARGIN_*), the outcome is decided — and a late spot
#  whipsaw still dips the WINNER's ask below $1. The sniper buys those dips,
#  bypassing ONLY max_edge (-> sniper_max_edge) and the late-window time
#  penalty; every safety gate (adverse, edge-decay, depth, net-edge, min-size,
#  pre-submit VWAP, freshness, raw-coverage) stays. Kill bar:
#  scripts/analyze_twap_lock.py is the sim ceiling; the BINDING gate is the
#  paper-shadow's realized fills. DO NOT enable on faith.
# =============================================================================
late_window:
  trading_enabled: true        # THE master brake (kill-bar SAFETY, not a strategy lever):
                               # false = no leg deploys capital — set it when the kill rule
                               # or the resolution-source gate trips. (Old name sniper_enabled
                               # is aliased with a deprecation warning.)
  taker_enabled: false         # lock-dip taker DORMANT-PENDING-REGIME (08-18 audit):
                               # its dip supply died with the 60s rule — 4 events / 1
                               # FOK-reachable over 5 days and 1,184 windows (bar:
                               # >=1 per 3 days), zero max-tier fires. The signal
                               # still evaluates and logs would-be fires; re-arm by
                               # flipping this once the nightly dip count says the
                               # whipsaw supply returned (RESEARCH.md).
  validation_epoch: "2026-09-04T15:50:00+00:00"  # deep_proj PAPER validation
                               # on the 08-27 re-fit margin tables (every
                               # knot 2-4x wider — the 08-18 freeze was one
                               # calm week) at the $400 go-live bankroll.
                               # Earlier epochs' fills armed on the thin
                               # tables and are evidence-recorded in
                               # RESEARCH.md #1, excluded from this gate.
                               # Set AFTER the boot that carries it
                               # by more than the ~3.4min entry-to-exit gap,
                               # because the gate filters on EXIT time — an
                               # earlier entry resolving later would otherwise
                               # be counted. The bar scores only the code being
                               # validated; never average across a change. The
                               # nightly health job scores only the current
                               # mode's fills at/after this instant.
  # Refuse to fire on the p99.5 tier — only the NEVER-BREACHED max tier deploys
  # capital. p99.5 broke three times in the 30s era while max held through every
  # one, and the 60s-rule sim replayed the same shape on day one (one p99.5
  # breach-loss at -95c vs thirteen +5c wins). One breach erases ~20 wins; the
  # thin tier is not worth its fires.
  require_max_tier: true
  twap_zone_s: 58.0             # decision zone stops at the last FITTED margin knot (k=58):
                                # past it the tables clamp to k=58 while the true error is
                                # larger — margin thinning. Never raise above 58.
  twap_k_min_s: 6.0             # NO LOW-K FIRES. Low-k margin knots are tail bounds too thin for
                                # the corpus to pin (the 30s era realized a k=1.1 max-tier breach
                                # that bought a $0 token — the scar this floor carries). The 60s
                                # tables tighten every knot but the floor stays 6.0 until the
                                # real-final corpus reaches ~14 days (see RESEARCH.md).
  sniper_min_edge: 0.04         # edge floor AND the ask cap in one knob: fire only when
                                # tier_prob − ask ≥ this (max-tier 0.999 → ask ≤ ~0.96;
                                # p99.5-tier 0.995 → ask ≤ ~0.955). Also the net-edge /
                                # pre-submit floor (SignalEngine.min_edge) — one consistent floor.
  sniper_max_edge: 0.50         # sniper's own sanity cap, replacing the bypassed 0.20
  sniper_fok_slip: 0.01         # FOK limit pad: fill only within ~one tick of the decision ask, else
                                # let the order DIE. The pad absorbs benign jitter; a genuine reprice
                                # (the dip snapping back to 0.99+ before our order lands) kills the
                                # FOK and the bot sits that window out — never chase a vanished dip
                                # upward. Burst-era realized fills proved wide pads (0.05) buy exactly
                                # the repriced books; one tick sits them out.

# =============================================================================
#  SECTION 3d: LOCK-INFORMED MAKER BID (the resting twin of the lock-dip taker)
#
#  When a window locks but no dip is trading yet, a GTC bid rests on the locked
#  side at (p99.5 prob − sniper_min_edge − discount) ≈ 0.935: the next whipsaw
#  panic fills us with ZERO latency and queue priority instead of a 0.4s FOK
#  race, and the resting size farms liquidity rewards while it waits. Cancelled
#  the instant the lock weakens or the window closes; the taker leg is
#  suppressed while a bid rests (one entry path per window). PAPER fills are
#  print-through conservative: only tape prints STRICTLY BELOW the bid count.
#  Fills stamp signal_leg="maker_bid" — its own ledger line in the ping.
# =============================================================================
maker:
  # LIVE-HALTED 2026-08-15 after 0-for-5 (-$34.18 in 9h): every fatal fill
  # fired with disp scraping the SNR floor in the chop regime the OOS sim had
  # flagged (-19c/day on its own 08-14). Enabled for PAPER validation — the
  # fill rule (strictly-below prints) is live-calibrated, so paper can only
  # under-promise. Live again ONLY via the §2 bar plus a trailing-3-day sim
  # clearing +5c/sh on fresh tape.
  maker_bid_enabled: true
  # THE DEEP-PROJECTION LADDER (signal_leg "deep_proj") — the 1723 mimic,
  # reverse-engineered 08-14 from the market's best late maker (+$12.9k/4.5d,
  # 99% maker, 124/814 windows): our projection's sign matches its side on 89%
  # of its deep fills and its edge is ZERO where the projection disagrees
  # (52.6% win). The book prices the final seconds off spot; the resolution is
  # an average that is mostly already written; panic crossing the spread fills
  # bids the book should never have left there.
  #
  # Rungs: [price, budget_fraction, need] where `need` is the MULTIPLE of the
  # p99.5 PROJECTION ERROR at the current k the displacement must clear — for
  # placement AND survival (maintain cancels the ladder the moment the floor
  # breaks). The floor's job is only to refuse photo-finishes; the rung PRICE
  # carries the risk (break-even win rate equals the price paid). need 0.6:
  # the engine-true frontier on 18 real-final 60s days (r19, 09-01) — 15/15
  # wins, 0 flip-fills, invariant to 56/300/500 ms GTC latency, 3.75x the
  # fill rate of 1.0; 0.5 costs two flip-fills, <=0.35 goes negative. The
  # 0.15 and 0.10 rungs buy 85-90c/sh of certainty on full sweeps (r22: 2/2
  # fills each, both halves positive). ANTI-side control at 0.5/0.25: -39c/sh.
  maker_ladder:
    - [0.80, 0.14, 0.6]
    - [0.65, 0.14, 0.6]
    - [0.50, 0.14, 0.6]
    - [0.35, 0.14, 0.6]
    - [0.20, 0.14, 0.6]
    - [0.15, 0.15, 0.6]
    - [0.10, 0.15, 0.6]
  maker_k_place_max: 58.0       # the whole zone: on the re-fit tables the
                                # floor at k=58 is 0.6 x $107.5, so only decided
                                # windows arm early (r24: 21 fills 100%, 0
                                # flip-fills at every k_max; the 08-18 k>25
                                # losses were the thin frozen tables).
  maker_k_place_min: 6.0        # placed rungs keep resting to the close +
                                # verified-winner hold
  # Deep bids are NOT a Kelly bet on a certainty claim — the budget is a flat
  # bankroll fraction split across rungs. One ladder at a time, capital back
  # in ~2 min at resolution. 0.40: fills are supply-bound and capital idles
  # 99% of the time, so $/fill is the linear lever (r22/r25: $ scales 1:1 with
  # budget on identical fills); ~half-Kelly at the pessimistic loss bound the
  # record supports (0 losses / 21 fills -> <=14% per fill); a full-ladder
  # loss (-40%) lands under the breaker floor and self-throttles to 0.4x.
  maker_bankroll_frac: 0.40
  # After the close, keep resting ONLY while the boundary-verified winner
  # equals our side (fails closed on delivery holes) — 23% of the reference
  # wallet's pnl lands in this tail at deep prices where no queue walls exist.
  # This is NOT the refuted 0.99 cap camp (102 live placements, 0 fills against
  # a ~290k wall): deep levels carry ~55-100 sh/level, measured live 08-14.
  post_close_hold_s: 60.0

# =============================================================================
#  SECTION 4: SCHEDULE
# =============================================================================
schedule:
  trading_start_hour_et: 0    # Start at 12:01 AM ET
  trading_start_minute: 1
  trading_end_hour_et: 23     # Stop at 11:30 PM ET
  trading_end_minute: 30

agents:
  outcome_reviewer_interval_seconds: 3600
  daily_pipeline_hour: 23     # Nightly jobs (rollups, retention sweep, sniper health report) at 11:45 PM ET
  daily_pipeline_minute: 45

# =============================================================================
#  DO NOT TOUCH - infrastructure settings
# =============================================================================
market:
  # Rule tripwire: the resolution stream Polymarket names on each market. The
  # 08-14 30s->60s switch flipped this field at the exact boundary window while
  # the description text stayed identical; a served value that differs halts
  # trading in-process (same path as the SOURCE gate). Re-point after autopsy.
  expected_resolution_source: "https://data.chain.link/streams/btc-usd-twap-60s-streams"
  min_time_remaining_seconds: 0
  scan_cache_seconds: 5
  clob_url: https://clob.polymarket.com
  clob_ws_url: wss://ws-subscriptions-clob.polymarket.com/ws/market
  min_book_depth_usd: 50
  max_spread: 0.1

discord:
  trade_channel_name: polybot-trades
  control_channel_name: polybot-control
  daily_channel_name: polybot-daily

database:
  path: polybot/db/polybot.db
